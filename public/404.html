<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="utf-8">
    <title>BikriBondhu BD - পুনঃনির্দেশিত হচ্ছে...</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Keeps path and query params when reloaded on sub-routes
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p style="text-align: center; margin-top: 50px; font-family: sans-serif; color: #4b5563;">
      BikriBondhu BD লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...
    </p>
  </body>
</html>
